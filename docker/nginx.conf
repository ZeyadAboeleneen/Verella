server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Media (product/menu/category images, hero banners, payment proofs) is
    # served directly from Cloudinary (res.cloudinary.com) — the browser
    # talks to Cloudinary directly for both uploads and delivery, so there's
    # no local proxy block needed here.

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Once you have a domain + TLS certs (see docs/SETUP.md for certbot steps),
# add a second server block on 443 with ssl_certificate directives and change
# the block above to redirect http -> https.

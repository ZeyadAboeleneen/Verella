name: verella

# Production stack: MySQL + the Next.js app + the WhatsApp gateway + Caddy (automatic HTTPS).
# Usage (from this folder, with ../.env filled in — see docs/SETUP.md):
#   docker compose up -d --build
#   docker compose run --rm migrator      # first deploy, and after schema changes

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-verella}
      MYSQL_USER: ${MYSQL_USER:-verella}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306" # localhost only — never exposed to the internet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # Inside Docker the gateway is the "whatsapp" service, not localhost.
      BAILEYS_SEND_URL: http://whatsapp:3001/send
    volumes:
      - model-cache:/models # AI model for automatic product backgrounds (downloaded once)
    expose:
      - "3000" # reachable by Caddy on the compose network only

  # Self-hosted WhatsApp gateway (openwa/index.js). Link it once from the live
  # dashboard → Settings (scan the QR code); the session is kept in the
  # whatsapp-session volume across restarts and updates.
  whatsapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: whatsapp
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      OPENWA_HOST: 0.0.0.0 # inside the container; not published — only "web" can reach it
      OPENWA_PORT: "3001"
      WEBHOOK_URL: http://web:3000/api/whatsapp/webhook
    volumes:
      - whatsapp-session:/repo/openwa/auth_info
    expose:
      - "3001" # compose network only — never exposed to the internet

  migrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrator
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ../.env
    profiles: ["tools"] # run on demand: docker compose run --rm migrator

  # Nightly gzipped dump into docker/backups/, 14 days kept. This protects
  # against mistakes, not against losing the server — copy the folder
  # off-site too (see docs/SETUP.md).
  backup:
    image: mysql:8.4
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      DB: ${MYSQL_DATABASE:-verella}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          mysqldump -h mysql -u root --single-transaction --routines --no-tablespaces "$$DB" | gzip > "/backups/$$DB-$$(date +%F).sql.gz"
          find /backups -name '*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. verella.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (Let's Encrypt expiry notices)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3

volumes:
  mysql-data:
  whatsapp-session: # the linked WhatsApp login — keep this volume
  model-cache:
  caddy-data: # certificates — keep this volume
  caddy-config:
